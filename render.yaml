services:
  # 1. Backend FastAPI Service
  - type: web
    name: voco-voice-backend
    env: python
    region: singapore   # change to your preferred region
    plan: starter       # use 'free' only for testing (cold starts)
    rootDirectory: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # ── Required ────────────────────────────────────────────────────
      - key: GOOGLE_API_KEY
        sync: false                   # Set in Render Dashboard → Environment
      - key: MONGO_URI
        sync: false                   # MongoDB Atlas connection string
      - key: MONGO_DB_NAME
        value: voco_voice

      # ── Twilio ──────────────────────────────────────────────────────
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false                   # e.g. whatsapp:+14155238886

      # ── WhatsApp / Meta (leave blank if using Twilio) ───────────────
      - key: WHATSAPP_PROVIDER
        value: twilio                 # "twilio" or "meta"
      - key: META_WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: META_WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: META_WHATSAPP_PHONE_NUMBER
        sync: false

      # ── Gemini ──────────────────────────────────────────────────────
      - key: GEMINI_MODEL
        value: gemini-2.0-flash-live-001
      - key: GEMINI_TEXT_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_VOICE
        value: Erinome
      - key: GEMINI_THINKING
        value: minimal

      # ── Zoho CRM (leave blank to disable) ───────────────────────────
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REFRESH_TOKEN
        sync: false
      - key: ZOHO_ORG_DOMAIN
        value: https://www.zohoapis.in

      # ── Server / CORS ───────────────────────────────────────────────
      # After first deploy, set EXTERNAL_URL to:  https://voco-voice-backend.onrender.com
      # and ALLOWED_ORIGINS to:                   https://voco-voice-frontend.onrender.com
      - key: EXTERNAL_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

      # ── Optional ────────────────────────────────────────────────────
      - key: API_KEY
        sync: false                   # leave empty to disable endpoint auth
      - key: MAX_CONCURRENT_CALLS
        value: "5"
      - key: MAX_APPOINTMENTS_PER_DAY
        value: "5"
      - key: PYTHONUNBUFFERED
        value: "1"

  # 2. Frontend React Static Site
  - type: web
    name: voco-voice-frontend
    env: static
    rootDirectory: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      # After first deploy copy the backend service URL here
      - key: REACT_APP_BACKEND_URL
        sync: false                   # e.g. https://voco-voice-backend.onrender.com
