services:
  - type: web
    name: codemate-voice
    env: python
    region: ohio
    plan: starter
    buildCommand: bash build.sh
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: voco_voice
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: WHATSAPP_PROVIDER
        value: twilio
      - key: META_WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: META_WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: META_WHATSAPP_PHONE_NUMBER
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash-live-001
      - key: GEMINI_TEXT_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_VOICE
        value: Erinome
      - key: GEMINI_THINKING
        value: minimal
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REFRESH_TOKEN
        sync: false
      - key: ZOHO_ORG_DOMAIN
        value: https://www.zohoapis.in
      - key: EXTERNAL_URL
        value: https://codemate-voice.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://codemate-voice.onrender.com
      - key: API_KEY
        sync: false
      - key: MAX_CONCURRENT_CALLS
        value: "5"
      - key: MAX_APPOINTMENTS_PER_DAY
        value: "5"
      - key: PYTHONUNBUFFERED
        value: "1"
